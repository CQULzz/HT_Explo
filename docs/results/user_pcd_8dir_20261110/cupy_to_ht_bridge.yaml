/cupy_to_ht_bridge:
  ros__parameters:
    elevation_topic: /elevation_mapping/elevation_map_raw
    ht_channels_last: false
    ht_context_backend: numpy
    ht_cpu_fuse_bn: true
    ht_device: cuda
    ht_diagnostics_capacity: 600
    ht_fuse_bn: true
    ht_history_backend: auto
    ht_processing_mode: worker
    ht_profile_runtime: true
    ht_qualify_evidence: false
    ht_quality_backend: auto
    ht_reason_interval_s: 1.0
    ht_small_hole_backend: auto
    ht_small_hole_fit_backend: auto
    ht_small_hole_profile: strict
    ht_small_hole_repair: false
    ht_stale_surface_s: 5.0
    ht_surface_margin_m: 0.15
    ht_topic: /ht_traversability/global_local
    ht_torch_threads: 2
    odometry_child_frame: ''
    surface_odometry_topic: /state_estimation
    surface_sensor_ground_offset_m: 0.75
    use_sim_time: false
