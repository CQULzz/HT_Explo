# User-authorized stationary initial patch. Radius includes complete cell extents.
# Untagged cells use the free prior; explicit observed labels replace it durably.
# Measured maps stay intact; the gate stores a separate per-cell effective state.
/localPlanner:
  ros__parameters:
    ht_initial_support_prior_enabled: true
    ht_initial_support_prior_radius: 0.65
/pathFollower:
  ros__parameters:
    ht_initial_support_prior_enabled: true
    ht_initial_support_prior_radius: 0.65
